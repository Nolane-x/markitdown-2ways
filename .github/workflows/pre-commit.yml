name: pre-commit
on: [pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install --install-hooks

      - name: Run formatter and stage artifact tree
        run: |
          pre-commit run --all-files || true
          mkdir -p /tmp/h4-black
          git diff --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "/tmp/h4-black/$(dirname "$path")"
            cp "$path" "/tmp/h4-black/$path"
          done
          git diff --name-only > /tmp/h4-black/FORMATTED_FILES.txt

      - name: Upload formatter output
        uses: actions/upload-artifact@v4
        with:
          name: h4-black-formatted
          path: /tmp/h4-black
          if-no-files-found: error
