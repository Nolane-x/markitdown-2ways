name: phase-e-format

on:
  push:
    branches:
      - nolane/phase-e-safe-table-cell-roundtrip

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nolane/phase-e-safe-table-cell-roundtrip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Apply pinned Black
        run: |
          python -m pip install black==23.7.0
          black packages/markitdown/src/markitdown/twoways/formats/pptx/table.py
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/markitdown/src/markitdown/twoways/formats/pptx/table.py
          git commit -m "style: apply Black 23.7.0 to PPTX table hardening"
          git push origin HEAD:nolane/phase-e-safe-table-cell-roundtrip
