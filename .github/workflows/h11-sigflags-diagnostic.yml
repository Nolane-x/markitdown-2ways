name: h11-sigflags-diagnostic
on: [pull_request]
permissions:
  contents: read

jobs:
  sigflags-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Hatch
        run: pipx install hatch
      - name: Run focused H11 SigFlags policy tests
        run: cd packages/markitdown; hatch run test:pytest tests/twoways/test_pdf_forms_signature_policy.py -q
