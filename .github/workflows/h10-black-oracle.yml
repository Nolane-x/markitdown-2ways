name: h10-black-oracle

on:
  pull_request:
    branches:
      - phase-h9-pdf-metadata-preservation

permissions:
  contents: read

jobs:
  black-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Install exact formatter
        run: pip install black==23.7.0
      - name: Print canonical Black diff
        run: |
          black packages/markitdown/src/markitdown/twoways/formats/pdf/reader.py packages/markitdown/tests/twoways/test_pdf_links_reader.py
          git diff -- packages/markitdown/src/markitdown/twoways/formats/pdf/reader.py packages/markitdown/tests/twoways/test_pdf_links_reader.py
