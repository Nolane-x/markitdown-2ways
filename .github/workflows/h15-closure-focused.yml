name: h15-closure-focused

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/mp3/**"
      - "packages/markitdown/tests/twoways/_mp3_fixtures.py"
      - "packages/markitdown/tests/twoways/test_mp3_id3v1_*.py"
      - "TWOWAYS.md"
      - ".github/workflows/h15-closure-focused.yml"

permissions:
  contents: read

jobs:
  closure-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package and pytest
        run: pip install -e ./packages/markitdown pytest
      - name: Run all H15 tests
        run: pytest -q packages/markitdown/tests/twoways/test_mp3_id3v1_*.py
