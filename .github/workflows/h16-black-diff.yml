name: h16-black-diff

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/msg/cfb.py"
      - "packages/markitdown/tests/twoways/_msg_fixtures.py"
      - "packages/markitdown/tests/twoways/test_msg_cfb_parser.py"
      - ".github/workflows/h16-black-diff.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install black==23.7.0
      - name: Print exact Black diff
        run: black --diff packages/markitdown/src/markitdown/twoways/formats/msg/cfb.py packages/markitdown/tests/twoways/_msg_fixtures.py packages/markitdown/tests/twoways/test_msg_cfb_parser.py
