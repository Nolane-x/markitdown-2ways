name: pre-commit
on: [pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install --install-hooks

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Capture formatted H5 files
        if: always()
        run: |
          tar -czf h5-formatted.tar.gz \
            packages/markitdown/src/markitdown/twoways/formats/html \
            packages/markitdown/tests/twoways/test_html_*.py

      - name: Upload formatted H5 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5-formatted
          path: h5-formatted.tar.gz
          if-no-files-found: error
