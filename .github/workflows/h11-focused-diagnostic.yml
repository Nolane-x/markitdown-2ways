name: h11-focused-diagnostic
on: [pull_request]
permissions:
  contents: read

jobs:
  native-owner-recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install Hatch
        run: pipx install hatch
      - name: Run focused H11 hardening contracts
        run: >-
          cd packages/markitdown;
          hatch test -py=3.13
          tests/twoways/test_pdf_forms_adversarial.py
          tests/twoways/test_pdf_forms_writer_native_recheck.py
          tests/twoways/test_pdf_forms_fidelity.py
          -q
