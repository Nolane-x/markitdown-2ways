name: phase-e-black-format

on:
  push:
    branches:
      - nolane/phase-e-safe-table-cell-roundtrip

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nolane/phase-e-safe-table-cell-roundtrip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install black==23.7.0
      - name: Format Phase E Python
        run: |
          black packages/markitdown/src/markitdown/twoways packages/markitdown/tests/twoways
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/markitdown/src/markitdown/twoways packages/markitdown/tests/twoways
          git commit -m 'style: apply Black 23.7.0 to Phase E'
          git push origin HEAD:nolane/phase-e-safe-table-cell-roundtrip
