name: pre-commit
on: [pull_request]

permissions:
  contents: write

jobs:
  pre-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install --install-hooks

      - name: Apply H3 formatter cleanup
        run: |
          pre-commit run --all-files || true
          git add \
            packages/markitdown/src/markitdown/twoways/formats/json/lexical.py \
            packages/markitdown/src/markitdown/twoways/formats/json/writer.py \
            packages/markitdown/tests/twoways/test_json_markdown_bridge.py \
            packages/markitdown/tests/twoways/test_json_lexical.py \
            packages/markitdown/tests/twoways/test_json_preservation.py \
            packages/markitdown/tests/twoways/test_json_reader.py \
            packages/markitdown/tests/twoways/test_json_writer.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format h3 json tranche"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
