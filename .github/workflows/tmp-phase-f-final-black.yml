name: tmp-phase-f-final-black

on:
  push:
    branches:
      - nolane/phase-f-full-parity-kernel-xlsx
    paths:
      - .github/workflows/tmp-phase-f-final-black.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: nolane/phase-f-full-parity-kernel-xlsx
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: pip install black==23.7.0
      - name: Format final XLSX hardening files
        run: |
          black \
            packages/markitdown/src/markitdown/twoways/formats/xlsx/reader.py \
            packages/markitdown/tests/twoways/test_xlsx_patch.py \
            packages/markitdown/tests/twoways/test_xlsx_reader.py
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/markitdown/src/markitdown/twoways/formats/xlsx/reader.py \
            packages/markitdown/tests/twoways/test_xlsx_patch.py \
            packages/markitdown/tests/twoways/test_xlsx_reader.py
          git commit -m "style: format final xlsx hardening"
          git push origin HEAD:nolane/phase-f-full-parity-kernel-xlsx
