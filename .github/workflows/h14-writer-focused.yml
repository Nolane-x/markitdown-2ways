name: h14-writer-focused

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/jpeg/**"
      - "packages/markitdown/tests/twoways/test_jpeg_exif_writer.py"
      - "packages/markitdown/tests/twoways/test_jpeg_exif_hardening.py"
      - "packages/markitdown/tests/twoways/_jpeg_fixtures.py"
      - ".github/workflows/h14-writer-focused.yml"

permissions:
  contents: read

jobs:
  writer-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package, pytest, and formatter
        run: pip install -e ./packages/markitdown pytest black==23.7.0
      - name: Run focused H14 writer tests
        run: pytest -q packages/markitdown/tests/twoways/test_jpeg_exif_writer.py packages/markitdown/tests/twoways/test_jpeg_exif_hardening.py
      - name: Print exact Black diff
        run: black --diff packages/markitdown/tests/twoways/test_jpeg_exif_hardening.py || true
