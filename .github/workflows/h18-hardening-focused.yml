name: h18-hardening-focused

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/readers/**"
      - "packages/markitdown/src/markitdown/twoways/__init__.py"
      - "packages/markitdown/tests/twoways/test_remote_wikipedia_*.py"
      - ".github/workflows/h18-hardening-focused.yml"

permissions:
  contents: read

jobs:
  hardening-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package and pytest
        run: pip install -e ./packages/markitdown pytest
      - name: Run H18 hardening and public-export tests
        run: |
          pytest -q \
            packages/markitdown/tests/twoways/test_remote_wikipedia_reader.py \
            packages/markitdown/tests/twoways/test_remote_wikipedia_hardening.py \
            packages/markitdown/tests/twoways/test_remote_wikipedia_public_imports.py
