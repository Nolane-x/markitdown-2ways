name: h15-black-diff

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/mp3/**"
      - "packages/markitdown/tests/twoways/_mp3_fixtures.py"
      - ".github/workflows/h15-black-diff.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - run: pip install black==23.7.0
      - name: Print exact formatter diff
        run: |
          black packages/markitdown/src/markitdown/twoways/formats/mp3/parser.py packages/markitdown/tests/twoways/_mp3_fixtures.py
          git diff -- packages/markitdown/src/markitdown/twoways/formats/mp3/parser.py packages/markitdown/tests/twoways/_mp3_fixtures.py
