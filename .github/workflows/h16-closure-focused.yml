name: h16-closure-focused

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/msg/**"
      - "packages/markitdown/tests/twoways/_msg_fixtures.py"
      - "packages/markitdown/tests/twoways/test_msg_*.py"
      - "packages/markitdown/tests/test_outlook_msg_ansi.py"
      - ".github/workflows/h16-closure-focused.yml"

permissions:
  contents: read

jobs:
  closure-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package, pytest, and olefile oracle
        run: pip install -e ./packages/markitdown pytest olefile
      - name: Run all H16 and one-way MSG tests
        run: |
          pytest -q             packages/markitdown/tests/twoways/test_msg_*.py             packages/markitdown/tests/test_outlook_msg_ansi.py
