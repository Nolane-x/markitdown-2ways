name: pre-commit
on: [pull_request]
permissions:
  actions: write
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded H11 runs
        env:
          CURRENT_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_HEAD_REF"]
          current_head = os.environ["CURRENT_HEAD"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          query = urllib.parse.urlencode({"branch": branch, "per_page": 100})
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?{query}",
              headers=headers,
          )
          with urllib.request.urlopen(request) as response:
              runs = json.load(response)["workflow_runs"]
          for run in runs:
              if run["head_sha"] == current_head:
                  continue
              if run["status"] not in {"queued", "in_progress"}:
                  continue
              cancel = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/cancel",
                  headers=headers,
                  method="POST",
              )
              try:
                  urllib.request.urlopen(cancel).read()
                  print(f"cancelled superseded run {run['id']} ({run['head_sha']})")
              except urllib.error.HTTPError as exc:
                  if exc.code not in {409, 422}:
                      raise
                  print(f"run {run['id']} already non-cancellable: HTTP {exc.code}")
          PY

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit and Hatch
        run: |
          pip install pre-commit
          pre-commit install --install-hooks
          pipx install hatch

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run focused H11 SigFlags RED contract
        run: cd packages/markitdown; hatch run test:pytest tests/twoways/test_pdf_forms_signature_policy.py -q
