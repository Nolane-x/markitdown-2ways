name: h15-reader-focused

on:
  pull_request:
    paths:
      - "packages/markitdown/src/markitdown/twoways/formats/mp3/**"
      - "packages/markitdown/tests/twoways/test_mp3_id3v1_reader.py"
      - "packages/markitdown/tests/twoways/test_mp3_id3v1_adapters.py"
      - "packages/markitdown/tests/twoways/test_mp3_id3v1_public_imports.py"
      - ".github/workflows/h15-reader-focused.yml"

permissions:
  contents: read

jobs:
  reader-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package and pytest
        run: pip install -e ./packages/markitdown pytest
      - name: Run focused H15 reader tests
        run: pytest -q packages/markitdown/tests/twoways/test_mp3_id3v1_reader.py packages/markitdown/tests/twoways/test_mp3_id3v1_adapters.py packages/markitdown/tests/twoways/test_mp3_id3v1_public_imports.py
