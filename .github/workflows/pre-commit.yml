name: pre-commit
on: [pull_request]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit and Hatch
        run: |
          pip install pre-commit
          pre-commit install --install-hooks
          pipx install hatch

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run focused H11 SigFlags RED contract
        run: cd packages/markitdown; hatch run test:pytest tests/twoways/test_pdf_forms_signature_policy.py -q
