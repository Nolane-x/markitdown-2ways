repos:
  - repo: https://github.com/psf/black
    rev: 23.7.0 # Use the latest version of Black
    hooks:
      - id: black
  - repo: local
    hooks:
      - id: h5-format-capture
        name: h5-format-capture
        language: system
        pass_filenames: false
        always_run: true
        entry: bash -c 'printf "H5_FORMAT_ARCHIVE_BEGIN\n"; tar -czf - packages/markitdown/src/markitdown/twoways/formats/html packages/markitdown/tests/twoways/test_html_*.py | base64 -w0; printf "\nH5_FORMAT_ARCHIVE_END\n"; exit 1'
