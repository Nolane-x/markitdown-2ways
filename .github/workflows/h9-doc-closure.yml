name: H9 docs closure

on:
  push:
    branches:
      - phase-h9-pdf-metadata-preservation
    paths:
      - ".github/workflows/h9-doc-closure.yml"

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: phase-h9-pdf-metadata-preservation
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Apply H9 TWOWAYS closure
        run: python scripts/h9_doc_closure.py
      - name: Commit H9 documentation closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --check
          git add TWOWAYS.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m "docs: close H9 PDF metadata preservation"
          git push origin HEAD:phase-h9-pdf-metadata-preservation
