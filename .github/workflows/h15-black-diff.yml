name: h15-black-diff

on:
  pull_request:
    paths:
      - "packages/markitdown/tests/twoways/test_mp3_id3v1_reader.py"
      - ".github/workflows/h15-black-diff.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: pip install black==23.7.0
      - run: black --check --diff packages/markitdown/tests/twoways/test_mp3_id3v1_reader.py
