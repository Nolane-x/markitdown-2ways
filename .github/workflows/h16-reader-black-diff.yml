name: h16-reader-black-diff

on:
  pull_request:
    paths:
      - "packages/markitdown/tests/twoways/test_msg_subject_reader.py"
      - ".github/workflows/h16-reader-black-diff.yml"

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install exact Black
        run: pip install black==23.7.0
      - name: Show exact Black diff
        run: |
          black --diff --check packages/markitdown/tests/twoways/test_msg_subject_reader.py || true
          exit 1
