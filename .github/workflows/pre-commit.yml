name: pre-commit
on: [pull_request]

permissions:
  contents: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: phase-h4-xml-source-preservation
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install --install-hooks

      - name: Apply formatter and commit exact output
        run: |
          pre-commit run --all-files || true
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/markitdown/src/markitdown/twoways/formats/xml \
                    packages/markitdown/tests/twoways/test_xml_*.py
            git commit -m "style: format h4 xml tranche"
            git push origin HEAD:phase-h4-xml-source-preservation
          fi
